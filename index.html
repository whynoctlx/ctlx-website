<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>citalopram</title>
    <meta name="description" content="citalopram — builds tools, trades markets, ships things that compound." />
    <meta name="theme-color" content="#1b1917" />
    <link rel="icon" type="image/jpeg" href="assets/profile.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <article class="card">
        <div class="avatar" style="--i: 0">
          <img src="assets/profile.jpeg" alt="" width="88" height="88" draggable="false" />
        </div>

        <h1 style="--i: 1">citalopram</h1>
        <p class="bio" style="--i: 2">
          Builds tools, trades markets, ships things that compound.
        </p>

        <ul class="links">
          <li style="--i: 3">
            <a href="https://ctlx.app" target="_blank" rel="noopener">
              <span class="link-name">ctlx.app</span>
              <span class="link-note">Atlas, Astral, the rest</span>
              <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4.5 11.5l7-7M5.5 4.5h6v6" />
              </svg>
            </a>
          </li>
          <li style="--i: 4">
            <a href="https://whyno.love" target="_blank" rel="noopener">
              <span class="link-name">whyno.love</span>
              <span class="link-note">Second node</span>
              <svg class="arrow" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4.5 11.5l7-7M5.5 4.5h6v6" />
              </svg>
            </a>
          </li>
        </ul>

        <footer style="--i: 5">
          <span>Bratislava, SK</span>
          <time id="clock" aria-label="Local time in Bratislava"></time>
        </footer>
      </article>
    </main>

    <script src="main.js"></script>
  </body>
</html>
